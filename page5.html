<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOUAE ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 18px;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at center,#a83f7d,#42123f 50%,#08030d);
    overflow:auto;
}

.container{
    width:100%;
    max-width:750px;
    text-align:center;
    animation:appear 2s ease;
}

h1{
    font-size:clamp(38px,11vw,65px);
    margin-bottom:12px;
    text-shadow:0 0 25px rgba(255,255,255,.8);
}

.subtitle{
    font-size:18px;
    opacity:.85;
    margin-bottom:30px;
}

.video-box{
    padding:10px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 25px 70px rgba(0,0,0,.6);
    animation:videoAppear 2s ease;
}

video{
    display:block;
    width:100%;
    max-height:75vh;
    border-radius:22px;
    background:#000;
}

.heart{
    font-size:45px;
    margin-top:25px;
    animation:beat 1.3s infinite;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes videoAppear{
    from{
        opacity:0;
        transform:scale(.85);
        filter:blur(10px);
    }
    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes beat{
    50%{
        transform:scale(1.25);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>THE LAST SUPRISE 🎬</h1>

    <p class="subtitle">
        A SHORT VIDEO FOR YOU ❤️
    </p>

    <div class="video-box">

        <video controls playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

    </div>

    <div class="heart">
        ❤️
    </div>

</div>

</body>
</html>
