<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une surprise ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #ffb6d9, #8b356f 45%, #130617);
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.card {
    padding: 40px 25px;
    max-width: 600px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: appear 1.5s ease;
}

.heart {
    font-size: 75px;
    animation: beat 1.2s infinite;
}

h1 {
    margin: 20px 0;
    font-size: clamp(40px, 11vw, 70px);
    text-shadow: 0 0 30px rgba(255,255,255,0.7);
}

p {
    font-size: 20px;
    line-height: 1.6;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 16px 30px;
    border-radius: 50px;
    background: white;
    color: #8b356f;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

.star {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(50px) scale(0.8);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes beat {
    50% {
        transform: scale(1.3);
    }
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Joyeux Anniversaire</h1>

        <p>
            J'ai préparé une petite surprise pour toi... ✨
        </p>

        <button onclick="goNext()">
            Découvrir la surprise ✨
        </button>

    </div>

</div>

<script>

const stars = document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 2 + "s";

    stars.appendChild(star);
}

function goNext() {
    window.location.href = "page2.html";
}

</script>

</body>
</html>
